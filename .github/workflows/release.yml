name: Release

# Pushing a `vX.Y.Z` tag publishes that version to npm, then creates the GitHub Release with the version's
# CHANGELOG.md section as notes. The tag must match package.json's version.
# npm auth is trusted publishing (OIDC): no npm token is stored, and provenance is attached automatically.
# Both steps live in one workflow because a release created with GITHUB_TOKEN doesn't trigger other workflows.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Releases run one at a time, and a running one is never cancelled halfway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11.x; trusted publishing needs npm >= 11.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # No dependency cache in release builds (npm's trusted publishing guidance)
      - uses: pnpm/action-setup@v6

      - name: Check tag matches package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 1.2.0-beta.1 and the like: npm dist-tag `next` instead of `latest`, and a GitHub pre-release
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      # Fail before publishing if the GitHub Release would have no notes
      - name: Check CHANGELOG.md has notes for this version
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null

      # A version already on npm (like 1.0.0, published by hand) is skipped, so its tag still gets a GitHub Release
      - name: Check whether this version is on npm
        id: npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
            echo "::notice::$NAME@${{ steps.version.outputs.version }} is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.npm.outputs.published == 'false'
        run: pnpm install --frozen-lockfile

      - if: steps.npm.outputs.published == 'false'
        run: pnpm lint

      - if: steps.npm.outputs.published == 'false'
        run: pnpm type-check

      # prepublishOnly runs test, build and publint before publishing
      - if: steps.npm.outputs.published == 'false'
        run: npm publish --tag ${{ steps.version.outputs.prerelease == 'true' && 'next' || 'latest' }}

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; updating its notes"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
              $([ "$PRERELEASE" = true ] && echo --prerelease)
          fi
